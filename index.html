<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleprompter</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Simple browser teleprompter - paste text, set speed, scroll.">
</head>
<body>
    <div class="app">
        <header class="app__header">
            <h1 class="app__title"><span class="brand">🐸 BatraPrompt</span> <span class="tagline">— Téléprompteur </span></h1>
        </header>

        <main class="app__main">
            <section class="controls" aria-label="Teleprompter Controls">
                <div class="field">
                    <label for="inputText">Text</label>
                    <textarea id="inputText" rows="6" placeholder="Paste or type your script here..."></textarea>
                </div>

                <div class="grid">
                    <div class="field">
                        <label for="speedInput">Speed (words/sec)</label>
                        <div class="inline">
                            <input id="speedInput" type="number" min="0.5" max="10" step="0.1" value="3" />
                            <input id="speedRange" type="range" min="0.5" max="10" step="0.1" value="3" />
                        </div>
                    </div>
                    <div class="field">
                        <label for="fontSizeInput">Font size (px)</label>
                        <div class="inline">
                            <input id="fontSizeInput" type="number" min="12" max="96" step="1" value="28" />
                            <input id="fontSizeRange" type="range" min="12" max="96" step="1" value="28" />
                        </div>
                    </div>
                </div>

                <div class="grid">
                    <div class="field">
                        <label class="checkbox">
                            <input id="fadeEdgesToggle" type="checkbox" checked />
                            <span>Fade top/bottom edges</span>
                        </label>
                    </div>
                </div>

                <div class="buttons">
                    <button id="startBtn" class="btn btn--primary">Start</button>
                    <button id="pauseBtn" class="btn" disabled>Pause</button>
                    <button id="resetBtn" class="btn" disabled>Reset</button>
                    <button id="generateBtn" class="btn">Generate</button>
                </div>
            </section>

            <section class="stage" aria-label="Teleprompter Stage">
                <div id="stageContainer" class="stage__viewport">
                    <div id="stageMaskTop" class="stage__mask stage__mask--top" aria-hidden="true"></div>
                    <div id="stageMaskBottom" class="stage__mask stage__mask--bottom" aria-hidden="true"></div>
                    <div id="prompt" class="prompt">
                        <div id="promptContent" class="prompt__content"></div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="app__footer">
            <small>Built for a simple, local teleprompter workflow.</small>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
