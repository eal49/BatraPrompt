<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BatraPrompt</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Teleprompter generator and viewer">
</head>
<body>
    <div class="landing">
        <div class="landing__center">
            <h1 class="landing__title">🐸 BatraPrompt</h1>
            <p class="landing__subtitle">Teleprompter generator and viewer</p>
            <div class="landing__actions">
                <a class="btn btn--primary" href="generator.html">Open Generator</a>
                <a class="btn" id="browseBtn" href="#">Browse Generated</a>
            </div>
        </div>
        <div class="landing__list" id="landingList" aria-live="polite"></div>
    </div>

    <script>
    (function(){
        const list = document.getElementById('landingList');
        const browseBtn = document.getElementById('browseBtn');

        function ownerRepoFromUrl(){
            // Works for user or project pages: https://<user>.github.io/<repo>/
            const host = location.host; // <user>.github.io
            const user = host.split('.')[0];
            const pathParts = location.pathname.split('/').filter(Boolean);
            const repo = pathParts[0] || '';
            return { user, repo };
        }

        async function fetchHtmlFiles(){
            const { user, repo } = ownerRepoFromUrl();
            if (!user) return [];
            try {
                const api = repo
                    ? `https://api.github.com/repos/${user}/${repo}/contents/`
                    : `https://api.github.com/repos/${user}/${user}.github.io/contents/`;
                const resp = await fetch(api);
                if (!resp.ok) return [];
                const data = await resp.json();
                return (Array.isArray(data) ? data : [])
                    .filter(it => /\.html$/i.test(it.name) && it.name !== 'index.html' && it.name !== 'generator.html')
                    .map(it => ({ name: it.name, path: it.path }));
            } catch { return []; }
        }

        function render(files){
            if (!list) return;
            if (!files.length){
                list.innerHTML = '<p class="landing__empty">No generated pages found.</p>';
                return;
            }
            list.innerHTML = files.map(f => `<a class=\"landing__item\" href=\"${encodeURI(f.name)}\">${f.name}</a>`).join('');
        }

        async function browse(){
            const files = await fetchHtmlFiles();
            render(files);
        }

        if (browseBtn) browseBtn.addEventListener('click', (e)=>{ e.preventDefault(); browse(); });
        // Auto-browse on load
        browse();
    })();
    </script>
</body>
</html>
