<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BatraPrompt</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Teleprompter generator and viewer">
</head>
<body>
    <div class="landing">
        <div class="landing__center">
            <h1 class="landing__title">🐸 BatraPrompt</h1>
            <p class="landing__subtitle">Teleprompter generator and viewer</p>
            <div class="landing__actions">
                <a class="btn btn--primary" href="generator.html">Open Generator</a>
                <a class="btn" id="browseBtn" href="#">Browse Generated</a>
            </div>
        </div>
        <div class="landing__list" id="landingList" aria-live="polite"></div>
    </div>

    <script>
    (function(){
        const list = document.getElementById('landingList');
        const browseBtn = document.getElementById('browseBtn');

        async function fetchManifest(){
            try {
                const resp = await fetch('./files.json');
                if (!resp.ok) return {};
                return await resp.json();
            } catch { return {}; }
        }

        function render(manifest){
            if (!list) return;
            const users = Object.entries(manifest).filter(([, files]) => files.length > 0);
            if (!users.length){
                list.innerHTML = '<p class="landing__empty">No generated pages found.</p>';
                return;
            }
            list.innerHTML = users.map(([user, files]) => `
                <details class="landing__group" open>
                    <summary class="landing__group-title">
                        <span class="landing__group-name">${user}</span>
                        <span class="landing__group-count">${files.length} file${files.length !== 1 ? 's' : ''}</span>
                    </summary>
                    <div class="landing__tree">
                        ${files.map(f => `<a class="landing__row" href="${encodeURI(user)}/${encodeURI(f)}">${f.replace(/\.html$/i, '')}</a>`).join('')}
                    </div>
                </details>`).join('');
        }

        async function browse(){
            const manifest = await fetchManifest();
            render(manifest);
        }

        if (browseBtn) browseBtn.addEventListener('click', (e)=>{ e.preventDefault(); browse(); });
        browse();
    })();
    </script>
</body>
</html>
